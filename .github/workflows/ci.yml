name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache LibTorch
        id: cache-libtorch
        uses: actions/cache@v4
        with:
          path: /opt/libtorch
          key: libtorch-cpu-2.4.0

      - name: Install LibTorch
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        run: |
          curl -sL https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.4.0%2Bcpu.zip -o libtorch.zip
          sudo unzip -q libtorch.zip -d /opt
          rm libtorch.zip

      - name: Install Boost + OpenCV
        run: sudo apt-get update && sudo apt-get install -y libboost-filesystem-dev libopencv-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Compiling the examples exercises nearly the whole public API surface
      # (every layer/optimizer/loss/activation type is #included by one of
      # them) without needing a dedicated smoke-test harness. Most examples
      # load datasets from hardcoded local paths, so we only compile them here.
      # example_ntk is excluded: it currently fails to compile (ambiguous
      # c10::impl::to_string), a pre-existing issue unrelated to this CI setup.
      # example_overhead and example_speedtest are excluded: benchmarks, not
      # useful as a CI compile check.
      - name: Compile examples
        run: >
          cmake --build build -j"$(nproc)" --target
          example_cifar10 example_dubai_segment example_ptbxl example_etth

      - name: Build test suite
        run: cmake --build build -j"$(nproc)" --target nott_tests

      # The suite is one binary but many ctest entries, one per category (see
      # tests/CMakeLists.txt). Running it as separate labelled steps means a
      # red X names the area that broke instead of the whole suite. Each step
      # runs to completion rather than stopping at the first failure, and
      # if: always() lets the later groups report even when an earlier one
      # fails, so one push shows every broken area at once.
      - name: Test - modules
        run: ctest --test-dir build -L module --output-on-failure

      - name: Test - serialization
        if: always()
        run: ctest --test-dir build -L serialization --output-on-failure

      - name: Test - runtime
        if: always()
        run: ctest --test-dir build -L runtime --output-on-failure

      - name: Test - integration
        if: always()
        run: ctest --test-dir build -L integration --output-on-failure

      # Guards the split itself: every ctest entry must carry one of the four
      # labels above, otherwise a newly added category would never run in CI
      # while the build still went green.
      - name: Check every test is covered by a label
        if: always()
        run: |
          all=$(ctest --test-dir build -N | grep -c "Test *#")
          labelled=$(ctest --test-dir build -N -L 'module|serialization|runtime|integration' | grep -c "Test *#")
          echo "labelled $labelled of $all ctest entries"
          if [ "$all" -ne "$labelled" ]; then
            echo "::error::$((all - labelled)) test(s) have no CI label and would never run"
            ctest --test-dir build -N -LE 'module|serialization|runtime|integration'
            exit 1
          fi
